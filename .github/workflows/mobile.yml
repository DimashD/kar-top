name: Mobile (merchant app)

# CI для Flutter-приложения магазина: проверка кода на каждый push/PR;
# сборка релизных .aab (Android) и .ipa (iOS) — вручную или по тегу.
on:
  push:
    branches: [main]
    tags: ["v*"]          # тег vX.Y.Z запускает релизные сборки
  pull_request:
  workflow_dispatch: {}   # кнопка «Run workflow» для релизной сборки вручную

defaults:
  run:
    working-directory: apps/merchant

jobs:
  # 1) Быстрая проверка: формат/анализ/тесты. Без секретов, на каждый push/PR.
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # 2) Релизный Android .aab. Запускается вручную (workflow_dispatch) или по тегу v*.
  android-release:
    needs: analyze
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      # Ключ подписи и пароли — из секретов репозитория (Settings → Secrets → Actions).
      - name: Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Вычищаем пробелы/переносы (частая проблема при вставке длинного base64) и декодируем.
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > android/kartop.jks
          echo "keystore size: $(wc -c < android/kartop.jks) bytes"
          # Проверяем, что ключ читается указанным паролем — иначе понятная ошибка.
          keytool -list -keystore android/kartop.jks -storepass "$STORE_PASSWORD" >/dev/null \
            || { echo "::error::Keystore invalid or wrong password — re-check ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets"; exit 1; }
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$(pwd)/android/kartop.jks
          EOF
      - run: flutter build appbundle --release --dart-define=API_BASE=${{ vars.API_BASE || 'https://kar-top.kz/api' }}
      - uses: actions/upload-artifact@v4
        with:
          name: kartop-merchant-aab
          path: apps/merchant/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
