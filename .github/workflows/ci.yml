name: CI
# Проверка PR (в т.ч. develop → main). Пуши в develop/main проверяются в deploy.yml перед сборкой образов.
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm --workspace apps/api run prisma:generate
      # Линтер пока не настроен (eslint не установлен в api, нет конфига в web) — не блокирует.
      - run: npm run lint --if-present
        continue-on-error: true
      - run: npm run build --if-present
      - run: npm test --if-present
