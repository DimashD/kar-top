name: Admin setup

# Ручной запуск из вкладки Actions: задаёт пароль и email администратора (сброс доступа).
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Окружение'
        type: choice
        options: [staging, production]
        default: staging
      password:
        description: 'Новый пароль админа (минимум 6 символов)'
        required: true
      email:
        description: 'Email админа'
        required: false
        default: 'dimash8888@gmail.com'
      phone:
        description: 'Телефон админа'
        required: false
        default: '+77011115999'

jobs:
  setup:
    runs-on: ubuntu-latest
    # Для production сработает подтверждение окружения (Required reviewers).
    environment: ${{ inputs.target }}
    steps:
      - name: Set admin password & email on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          IN_PASS: ${{ inputs.password }}
          IN_EMAIL: ${{ inputs.email }}
          IN_PHONE: ${{ inputs.phone }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          envs: IN_PASS,IN_EMAIL,IN_PHONE
          script: |
            if [ "${{ inputs.target }}" = production ]; then
              cd /opt/kar-top && C="docker compose -p kar-top --env-file .env.prod -f docker-compose.prod.yml" && SVC=api
            else
              cd /opt/kar-top-staging && C="docker compose -p kartop-staging --env-file .env.staging -f docker-compose.staging.yml" && SVC=staging-api
            fi
            $C exec -T $SVC node prisma/grant-admin.js "$IN_PHONE" "$IN_PASS" "$IN_EMAIL"
