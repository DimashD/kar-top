name: Seed catalog

# Ручной запуск: наполняет мастер-каталог на сервере (идемпотентно).
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Окружение'
        type: choice
        options: [staging, production]
        default: staging

jobs:
  seed:
    runs-on: ubuntu-latest
    # Для production сработает подтверждение окружения (Required reviewers).
    environment: ${{ inputs.target }}
    steps:
      - name: Run catalog seed on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            if [ "${{ inputs.target }}" = production ]; then
              cd /opt/kar-top && C="docker compose -p kar-top --env-file .env.prod -f docker-compose.prod.yml" && SVC=api
            else
              cd /opt/kar-top-staging && C="docker compose -p kartop-staging --env-file .env.staging -f docker-compose.staging.yml" && SVC=staging-api
            fi
            $C exec -T $SVC node prisma/seed-catalog.js
