name: Deploy to VPS

# Авто-деплой: любой пуш в main (или ручной запуск) заливает код на сервер и пересобирает.
# Серверу не нужен доступ к GitHub — код загружает runner по SSH.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   SERVER_HOST=89.126.205.212  SERVER_USER=root  SERVER_PASSWORD=<пароль root>
on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/merchant/**'   # мобилка деплой VPS не затрагивает
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload code to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "."
          target: "/opt/kar-top"
          rm: false
          overwrite: true

      - name: Build & restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/kar-top
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
            docker image prune -f
            echo "Deploy OK"
