name: E2E

# Автотесты сайта в настоящем браузере (Chrome) — на компьютере и на телефоне.
# Запускаются сами после каждой выкатки на тест (test.kar-top.kz), раз в сутки и вручную.
# Тестовый заказ оформляется только на тестовой среде и сразу отменяется.
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [develop]
  schedule:
    - cron: '0 3 * * *'   # 09:00 по Алматы
  pull_request:
    paths: ['e2e/**', '.github/workflows/e2e.yml']
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Адрес сайта'
        default: 'https://test.kar-top.kz'

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: e2e
    env:
      BASE_URL: ${{ inputs.base_url || 'https://test.kar-top.kz' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Отчёт (скриншоты и запись при падении)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e/playwright-report
          retention-days: 14
