# ПРОД (kar-top.kz). Тестовая среда — docker-compose.staging.yml (см. docs/28-environments.md).
# Обычный деплой делает GitHub Actions: готовые образы из GHCR (API_IMAGE/WEB_IMAGE) → deploy/deploy.sh.
# Первичная установка на чистый сервер (сборка на месте):
#   sudo bash deploy/bootstrap.sh kar-top.kz admin@kar-top.kz
# ВАЖНО: ПДн граждан РК по закону хранятся в Казахстане — размещать в КЗ (PS.KZ / Yandex Cloud kz1).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: freshmarket
      POSTGRES_PASSWORD: ${DB_PASSWORD:-freshmarket}
      POSTGRES_DB: freshmarket
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-kar-top-api:local}
    build: { context: ./apps/api }
    environment:
      NODE_ENV: production
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-local}
      PORT: 3000
      DATABASE_URL: postgresql://freshmarket:${DB_PASSWORD:-freshmarket}@db:5432/freshmarket?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set me}
      WEB_BASE_URL: https://${DOMAIN}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
      # Вход через Telegram-бот (@kartop_kz_bot). Вебхук у бота один — ставит среда с TELEGRAM_BOT_WEBHOOK=1.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_NAME: kartop_kz_bot
      TELEGRAM_BOT_WEBHOOK: ${TELEGRAM_BOT_WEBHOOK:-0}
      SMS_API_KEY: ${SMS_API_KEY:-}
      # Коды и уведомления (docs/30): SMS — SMSC.kz, WhatsApp — Meta Cloud API.
      SMSC_LOGIN: ${SMSC_LOGIN:-}
      SMSC_PASSWORD: ${SMSC_PASSWORD:-}
      SMS_SENDER_NAME: ${SMS_SENDER_NAME:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_OTP_TEMPLATE: ${WHATSAPP_OTP_TEMPLATE:-kartop_otp}
      # 1 — покупателю без приложения важные статусы заказа уходят SMS (платно).
      NOTIFY_SMS_FALLBACK: ${NOTIFY_SMS_FALLBACK:-0}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      # Email через SMTP (nodemailer): для кодов на почту и писем сброса пароля.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      KASPI_MERCHANT_ID: ${KASPI_MERCHANT_ID:-}
      KASPI_API_KEY: ${KASPI_API_KEY:-}
      # Push (FCM): положить JSON сервис-аккаунта целиком в эту переменную (.env.prod) — тогда пуши уходят реально.
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      # Фоновые задачи: отправка уведомлений из очереди (каждые 5 с) и ежемесячные счета.
      SCHEDULER_ENABLED: "1"
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    depends_on: [db, redis]
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-kar-top-web:local}
    build: { context: ./apps/web }
    environment:
      NODE_ENV: production
      # SSR внутри контейнера ходит на API по внутреннему адресу; браузер — на /api (через Caddy).
      API_BASE_INTERNAL: http://api:3000/api
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on: [api, web]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, напр. kar-top.kz}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      # Тестовая среда на этом же сервере: Caddy проксирует её домен на контейнеры staging-*.
      STAGING_DOMAIN: ${STAGING_DOMAIN:-test.kar-top.kz}
    networks: [default, edge]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports: ["80:80", "443:443"]
    restart: unless-stopped

networks:
  # Общая сеть «прод-Caddy ↔ staging-контейнеры». Создаётся deploy.sh / bootstrap.sh.
  edge:
    name: kartop-edge
    external: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
