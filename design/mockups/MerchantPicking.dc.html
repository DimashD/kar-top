<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Магазин — сборка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F7A40;text-decoration:none}a:hover{color:#0A5C30}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Onest, system-ui, sans-serif; color: #121712; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="MerchantOrders.dc.html" aria-label="К заказам" style="width: 44px; height: 44px; border-radius: 22px; background: #F3F4EF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121712" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 800">Сборка № 20479</span><span style="font-size: 12px; color: #5E665F">6 из 11 · собрать к 17:30</span></div>
      <button aria-label="Позвонить клиенту" style="all: unset; cursor: pointer; width: 48px; height: 48px; border-radius: 24px; background: #0F7A40; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="11"><span style="height: 6px; border-radius: 3px; background: {{b.c}}"></span></sc-for>
    </div>
  </div>

  <div style="margin: 0 16px; border-radius: 26px; background: #FDEDEA; padding: 14px; display: flex; gap: 14px; align-items: center">
    <span style="width: 84px; flex-shrink: 0"><dc-import name="Fruit" kind="tomato" hint-size="84px,84px"></dc-import></span>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.01em">Помидоры розовые</span>
      <span style="font-size: 14px; color: #3A423B">Клиент просил <b>1,5 кг</b> · 1 190 ₸/кг</span>
      <span style="font-size: 12px; font-weight: 700; background: #FFFFFF; padding: 4px 9px; border-radius: 999px; align-self: flex-start">Полка 3 · ящик слева</span>
    </div>
  </div>

  <div style="padding: 14px 16px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px">
    <span style="font-size: 12px; font-weight: 700; color: #5E665F; text-transform: uppercase; letter-spacing: .06em">Вес на весах</span>
    <span style="font-size: 56px; font-weight: 800; letter-spacing: -0.04em; line-height: 1">1,62 <span style="font-size: 26px">кг</span></span>
    <span style="font-size: 14px; font-weight: 700; color: #0F7A40">1 928 ₸ · +8%, в пределах нормы</span>
  </div>

  <div style="flex: 1; padding: 10px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-content: start">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button style="all: unset; cursor: pointer; height: 58px; border-radius: 18px; background: #F3F4EF; text-align: center; line-height: 58px; font-size: 24px; font-weight: 700">{{k}}</button>
    </sc-for>
  </div>

  <div style="padding: 12px 16px 24px; display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px">
    <button style="all: unset; cursor: pointer; height: 64px; border-radius: 999px; background: #FDECE3; color: #B93A0B; text-align: center; line-height: 64px; font-size: 15px; font-weight: 800">Нет / замена</button>
    <button style="all: unset; cursor: pointer; height: 64px; border-radius: 999px; background: #121712; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800">Готово<span style="color: #D7F45B">→ Огурцы</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      bars: Array.from({ length: 11 }, (_, i) => ({ c: i < 5 ? '#0F7A40' : (i === 5 ? '#D7F45B' : '#E6E8E2') })),
      keys: ['1', '2', '3', '4', '5', '6', '7', '8', '9', ',', '0', '⌫']
    };
  }
}
</script>
</body>
</html>
