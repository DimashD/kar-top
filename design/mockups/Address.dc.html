<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Адрес доставки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F7A40;text-decoration:none}a:hover{color:#0A5C30}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EA; font-family: Onest, system-ui, sans-serif; color: #121712; position: relative; overflow: hidden">
  <svg width="390" height="440" viewBox="0 0 390 440" style="position: absolute; top: 0; left: 0" aria-hidden="true">
    <rect width="390" height="440" fill="#EEF0EA"></rect>
    <rect x="250" y="250" width="160" height="120" rx="12" fill="#D4EAC6"></rect>
    <path d="M-10 196 L400 176" stroke="#FFFFFF" stroke-width="30"></path>
    <path d="M150 -10 L170 450" stroke="#FFFFFF" stroke-width="22"></path>
    <path d="M-10 360 L240 350" stroke="#FFFFFF" stroke-width="14"></path>
    <path d="M300 -10 L310 170" stroke="#FFFFFF" stroke-width="12"></path>
    <rect x="18" y="40" width="54" height="40" rx="6" fill="#DCDFD6"></rect><rect x="84" y="36" width="50" height="58" rx="6" fill="#DCDFD6"></rect>
    <rect x="18" y="96" width="116" height="64" rx="6" fill="#DCDFD6"></rect>
    <rect x="188" y="30" width="96" height="54" rx="6" fill="#DCDFD6"></rect><rect x="188" y="96" width="44" height="58" rx="6" fill="#DCDFD6"></rect>
    <rect x="244" y="100" width="44" height="54" rx="6" fill="#DCDFD6"></rect><rect x="324" y="40" width="56" height="110" rx="6" fill="#DCDFD6"></rect>
    <rect x="20" y="222" width="54" height="110" rx="6" fill="#DCDFD6"></rect><rect x="84" y="222" width="54" height="50" rx="6" fill="#DCDFD6"></rect>
    <rect x="186" y="214" width="92" height="96" rx="8" fill="#C9CEC1" stroke="#121712" stroke-width="2.5"></rect>
    <rect x="292" y="206" width="70" height="34" rx="6" fill="#DCDFD6"></rect>
    <rect x="20" y="380" width="130" height="50" rx="6" fill="#DCDFD6"></rect><rect x="186" y="376" width="70" height="60" rx="6" fill="#DCDFD6"></rect>
    <text x="40" y="192" font-family="Onest, sans-serif" font-size="12" font-weight="700" fill="#5E665F" transform="rotate(-2.8 40 192)">просп. Абая</text>
    <text x="174" y="20" font-family="Onest, sans-serif" font-size="11" font-weight="600" fill="#5E665F" transform="rotate(87 174 20)">ул. Байзакова</text>
    <text x="107" y="66" font-family="Onest, sans-serif" font-size="11" font-weight="700" fill="#4A524B">14</text>
    <text x="226" y="60" font-family="Onest, sans-serif" font-size="11" font-weight="700" fill="#4A524B">12/1</text>
    <text x="40" y="282" font-family="Onest, sans-serif" font-size="11" font-weight="700" fill="#4A524B">8</text>
    <text x="104" y="250" font-family="Onest, sans-serif" font-size="11" font-weight="700" fill="#4A524B">8а</text>
    <text x="222" y="300" font-family="Onest, sans-serif" font-size="13" font-weight="800" fill="#121712">10</text>
    <rect x="196" y="304" width="12" height="6" rx="2" fill="#0F7A40"></rect><rect x="226" y="304" width="12" height="6" rx="2" fill="#121712"></rect><rect x="256" y="304" width="12" height="6" rx="2" fill="#0F7A40"></rect>
    <text x="300" y="320" font-family="Onest, sans-serif" font-size="11" font-weight="600" fill="#4E7A3E">сквер</text>
  </svg>

  <div style="position: absolute; left: 0; right: 0; top: 16px; padding: 0 16px; display: flex; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Назад" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(18,23,18,.12)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121712" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <button aria-label="Моё местоположение" style="all: unset; cursor: pointer; width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(18,23,18,.12)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121712" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>
  </div>

  <div style="position: absolute; left: 136px; top: 168px; display: flex; flex-direction: column; align-items: center">
    <span style="background: #121712; color: #FFFFFF; font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 999px; white-space: nowrap">Подъезд 2 · здесь</span>
    <span style="width: 3px; height: 18px; background: #121712"></span>
    <span style="width: 14px; height: 14px; border-radius: 7px; background: #D7F45B; border: 3px solid #121712"></span>
  </div>
  <span style="position: absolute; right: 12px; top: 412px; font-size: 10px; color: #5E665F; background: rgba(255,255,255,.8); padding: 2px 6px; border-radius: 6px">© OpenStreetMap · MapLibre</span>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 432px; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 16px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -10px 30px rgba(18,23,18,.08)">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #E6E8E2"></span>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">просп. Абая, 10</span>
        <span style="font-size: 13px; font-weight: 600; color: #0F7A40">В зоне доставки · 1,2 км от магазина</span>
      </div>
      <span style="font-size: 14px; font-weight: 700; color: #0F7A40">Изменить</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
        <label style="display: flex; flex-direction: column; gap: 2px; background: #F3F4EF; border-radius: 16px; padding: 8px 10px; border: 2px solid {{f.border}}">
          <span style="font-size: 11px; font-weight: 600; color: #5E665F">{{f.label}}</span>
          <input type="text" value="{{f.value}}" style="border: 0; background: transparent; font: inherit; font-size: 17px; font-weight: 800; width: 100%; outline: none; padding: 0">
        </label>
      </sc-for>
    </div>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{entrances}}" as="e" hint-placeholder-count="3">
        <button onClick="{{e.pick}}" style="all: unset; cursor: pointer; flex: 1; height: 40px; border-radius: 999px; text-align: center; line-height: 40px; font-size: 13px; font-weight: 700; background: {{e.bg}}; color: {{e.fg}}">{{e.label}}</button>
      </sc-for>
    </div>
    <label style="display: flex; flex-direction: column; gap: 2px; background: #F3F4EF; border-radius: 16px; padding: 10px 12px">
      <span style="font-size: 11px; font-weight: 600; color: #5E665F">Комментарий курьеру</span>
      <input type="text" value="Вход со двора, шлагбаум откроют" style="border: 0; background: transparent; font: inherit; font-size: 15px; font-weight: 500; outline: none; padding: 0">
    </label>
    <a href="Main.dc.html" style="margin-top: auto; height: 56px; border-radius: 999px; background: #0F7A40; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">Сохранить адрес</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ent: 2 }; }
  renderVals() {
    const ent = this.state.ent;
    return {
      fields: [
        { label: 'Подъезд', value: String(ent), border: '#121712' },
        { label: 'Этаж', value: '5', border: 'transparent' },
        { label: 'Кв.', value: '25', border: 'transparent' },
        { label: 'Домофон', value: '25', border: 'transparent' }
      ],
      entrances: [1, 2, 3].map((n) => ({
        label: 'Подъезд ' + n, bg: n === ent ? '#121712' : '#F3F4EF', fg: n === ent ? '#FFFFFF' : '#121712',
        pick: () => this.setState({ ent: n })
      }))
    };
  }
}
</script>
</body>
</html>
