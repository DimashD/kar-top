<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Главная</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F7A40;text-decoration:none}a:hover{color:#0A5C30}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Onest, system-ui, sans-serif; color: #121712; position: relative; overflow: hidden">
  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="Address.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 6px; border-radius: 999px; background: #F3F4EF; color: #121712">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #121712; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D7F45B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.3"></circle></svg></span>
        <span style="font-size: 14px; font-weight: 700">Абая, 10 · подъезд 2</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#121712" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </a>
      <button aria-label="Профиль" style="all: unset; cursor: pointer; width: 44px; height: 44px; border-radius: 22px; background: #D7F45B; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px">А</button>
    </div>

    <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.04">Свежее с рынка —<br>к вам домой</h1>

    <label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px; border-radius: 999px; background: #F3F4EF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E665F" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Поиск</span>
      <input type="search" placeholder="Хурма, укроп, магазин…" style="border: 0; background: transparent; font: inherit; font-size: 16px; flex: 1; outline: none; color: #121712">
    </label>

    <a href="Store.dc.html" style="border-radius: 28px; background: #121712; color: #FFFFFF; padding: 18px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 12px; font-weight: 700; color: #D7F45B; text-transform: uppercase; letter-spacing: .06em">Ваш магазин</span>
          <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Фрукты у Руслана</span>
          <span style="font-size: 13px; color: #C9CFC9">Привезут сегодня 18:00–20:00</span>
        </div>
        <div style="display: flex">
          <span style="width: 46px; height: 46px; border-radius: 23px; background: #2A322A; padding: 4px; box-sizing: border-box"><dc-import name="Fruit" kind="apple" hint-size="38px,38px"></dc-import></span>
          <span style="width: 46px; height: 46px; border-radius: 23px; background: #2A322A; padding: 4px; box-sizing: border-box; margin-left: -12px"><dc-import name="Fruit" kind="greens" hint-size="38px,38px"></dc-import></span>
          <span style="width: 46px; height: 46px; border-radius: 23px; background: #2A322A; padding: 4px; box-sizing: border-box; margin-left: -12px"><dc-import name="Fruit" kind="tomato" hint-size="38px,38px"></dc-import></span>
        </div>
      </div>
      <span style="height: 48px; border-radius: 999px; background: #D7F45B; color: #121712; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 800">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121712" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"></path></svg>
        Повторить прошлый заказ · 8 товаров
      </span>
    </a>
  </div>

  <div style="display: flex; gap: 10px; padding: 18px 16px 0">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
      <button style="all: unset; cursor: pointer; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="width: 100%; aspect-ratio: 1 / 1; border-radius: 22px; background: {{c.bg}}; padding: 8px; box-sizing: border-box"><dc-import name="Fruit" kind="{{c.kind}}" hint-size="100%,64px"></dc-import></span>
        <span style="font-size: 13px; font-weight: 700">{{c.name}}</span>
      </button>
    </sc-for>
  </div>

  <div style="padding: 22px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Рядом с вами</h2>
      <span style="font-size: 14px; font-weight: 600; color: #5E665F">12 магазинов</span>
    </div>
    <sc-for list="{{stores}}" as="s" hint-placeholder-count="2">
      <a href="Store.dc.html" style="display: flex; gap: 14px; align-items: center; color: #121712">
        <span style="width: 84px; height: 84px; border-radius: 22px; background: {{s.bg}}; flex-shrink: 0; position: relative; display: flex; align-items: center; justify-content: center">
          <span style="width: 62px"><dc-import name="Fruit" kind="{{s.kind}}" hint-size="62px,62px"></dc-import></span>
        </span>
        <span style="display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0">
          <span style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-size: 17px; font-weight: 800; letter-spacing: -0.01em">{{s.name}}</span>
            <span style="font-size: 13px; font-weight: 800; background: #F3F4EF; border-radius: 999px; padding: 4px 8px">★ {{s.rating}}</span>
          </span>
          <span style="font-size: 13px; color: #5E665F">{{s.tags}}</span>
          <span style="display: flex; gap: 6px; flex-wrap: wrap">
            <span style="font-size: 12px; font-weight: 700; background: #D7F45B; padding: 4px 9px; border-radius: 999px">{{s.slot}}</span>
            <span style="font-size: 12px; font-weight: 600; background: #F3F4EF; padding: 4px 9px; border-radius: 999px">{{s.fee}}</span>
          </span>
        </span>
      </a>
    </sc-for>
  </div>

  <nav style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 64px; border-radius: 999px; background: #121712; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 8px; box-shadow: 0 12px 30px rgba(18,23,18,.28)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <button aria-label="{{t.label}}" style="all: unset; cursor: pointer; display: flex; justify-content: center">
        <span style="height: 48px; min-width: 48px; border-radius: 999px; background: {{t.bg}}; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; box-sizing: border-box; font-size: 13px; font-weight: 800; color: #121712">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
          <sc-if value="{{t.active}}" hint-placeholder-val="{{ false }}"><span>{{t.label}}</span></sc-if>
        </span>
      </button>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tabs = [
      { label: 'Главная', icon: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z' },
      { label: 'Каталог', icon: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' },
      { label: 'Заказы', icon: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6' },
      { label: 'Корзина', icon: 'M5 7h14l-1.5 10h-11zM9 7a3 3 0 0 1 6 0' }
    ];
    return {
      cats: [
        { name: 'Фрукты', kind: 'apple', bg: '#FDEDEA' },
        { name: 'Овощи', kind: 'tomato', bg: '#FFF1E6' },
        { name: 'Зелень', kind: 'greens', bg: '#EAF6E4' },
        { name: 'Сезон', kind: 'persimmon', bg: '#F6F9D9' }
      ],
      stores: [
        { name: 'Зелёный базар', kind: 'cucumber', bg: '#EAF6E4', rating: '4.8', tags: 'Фермерское · Зелень · Ягоды', slot: 'Через 45 мин', fee: 'Бесплатно от 10 000 ₸' },
        { name: 'Сад и огород', kind: 'carrot', bg: '#FFF1E6', rating: '4.7', tags: 'Овощи · Картофель · Соленья', slot: 'Завтра 09:00–11:00', fee: 'Доставка 700 ₸' }
      ],
      tabs: tabs.map((t, i) => ({ ...t, active: i === 0, bg: i === 0 ? '#D7F45B' : 'transparent', color: i === 0 ? '#121712' : '#FFFFFF' }))
    };
  }
}
</script>
</body>
</html>
