<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Магазин — цены дня</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F7A40;text-decoration:none}a:hover{color:#0A5C30}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: Onest, system-ui, sans-serif; color: #121712; position: relative; overflow: hidden">
  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Товары</h1>
      <button style="all: unset; cursor: pointer; height: 44px; padding: 0 16px; border-radius: 999px; background: #121712; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D7F45B" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Из каталога</button>
    </div>
    <div style="border-radius: 24px; background: #D7F45B; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 16px; font-weight: 800">Цены на сегодня</span><span style="font-size: 13px; font-weight: 800">{{done}} из 126</span></div>
      <div style="height: 8px; border-radius: 4px; background: rgba(18,23,18,.12); overflow: hidden"><div style="width: 30%; height: 8px; background: #121712; border-radius: 4px"></div></div>
      <span style="font-size: 12px; font-weight: 600">Проверьте цену и наличие — покупатели видят изменения сразу</span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-radius: 999px; background: #F3F4EF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E665F" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Поиск товара</span>
      <input type="search" placeholder="Найти товар" style="border: 0; background: transparent; font: inherit; font-size: 15px; flex: 1; outline: none">
    </label>
    <div style="display: flex; gap: 8px">
      <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: #121712; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center">Все</span>
      <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: #F3F4EF; font-size: 13px; font-weight: 600; display: flex; align-items: center">Не проверены</span>
      <span style="height: 36px; padding: 0 14px; border-radius: 999px; background: #F3F4EF; font-size: 13px; font-weight: 600; display: flex; align-items: center">Нет в наличии</span>
    </div>
  </div>

  <div style="padding: 10px 16px 0; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #E6E8E2; opacity: {{r.opacity}}">
        <span style="width: 52px; height: 52px; border-radius: 16px; background: {{r.bg}}; padding: 6px; box-sizing: border-box; flex-shrink: 0"><dc-import name="Fruit" kind="{{r.kind}}" hint-size="40px,40px"></dc-import></span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{r.name}}</span><span style="font-size: 12px; color: #5E665F">{{r.meta}}</span></span>
        <label style="height: 44px; border-radius: 14px; background: #F3F4EF; display: flex; align-items: center; padding: 0 10px; gap: 2px">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Цена</span>
          <input type="text" inputmode="numeric" value="{{r.price}}" style="width: 52px; border: 0; background: transparent; font: inherit; font-size: 15px; font-weight: 800; text-align: right; outline: none">
          <span style="font-size: 13px; font-weight: 700; color: #5E665F">₸</span>
        </label>
        <button onClick="{{r.toggle}}" aria-label="В наличии: {{r.name}}" style="all: unset; cursor: pointer; width: 52px; height: 32px; border-radius: 16px; background: {{r.track}}; position: relative; flex-shrink: 0">
          <span style="position: absolute; top: 4px; left: {{r.knob}}; width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span>
        </button>
      </div>
    </sc-for>
  </div>

  <nav style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 64px; border-radius: 999px; background: #121712; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 8px; box-shadow: 0 12px 30px rgba(18,23,18,.28)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
      <a href="{{t.href}}" aria-label="{{t.label}}" style="display: flex; justify-content: center">
        <span style="height: 48px; min-width: 48px; border-radius: 999px; background: {{t.bg}}; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; box-sizing: border-box; font-size: 13px; font-weight: 800; color: #121712">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.color}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
          <sc-if value="{{t.active}}" hint-placeholder-val="{{ false }}"><span>{{t.label}}</span></sc-if>
        </span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { off: { blueberry: true } }; }
  renderVals() {
    const base = [
      { id: 'apple', kind: 'apple', bg: '#FDEDEA', name: 'Яблоки Апорт', meta: 'за кг · вчера 850', price: '890' },
      { id: 'banana', kind: 'banana', bg: '#FFF7D6', name: 'Бананы Эквадор', meta: 'за кг · скидка −15%', price: '760' },
      { id: 'persimmon', kind: 'persimmon', bg: '#FFF1E6', name: 'Хурма Королёк', meta: 'за кг', price: '1290' },
      { id: 'tomato', kind: 'tomato', bg: '#FDEDEA', name: 'Помидоры розовые', meta: 'за кг', price: '1190' },
      { id: 'greens', kind: 'greens', bg: '#EAF6E4', name: 'Укроп', meta: 'за пучок', price: '250' },
      { id: 'blueberry', kind: 'pomegranate', bg: '#FCE9EE', name: 'Гранат', meta: 'за шт', price: '450' }
    ];
    const off = this.state.off;
    const tabs = [
      { label: 'Заказы', href: 'MerchantOrders.dc.html', icon: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6' },
      { label: 'Товары', href: 'MerchantCatalog.dc.html', icon: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z' },
      { label: 'Доставка', href: 'MerchantZones.dc.html', icon: 'M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z' },
      { label: 'График', href: 'MerchantSchedule.dc.html', icon: 'M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z' }
    ];
    return {
      done: 38,
      rows: base.map((r) => {
        const isOff = !!off[r.id];
        return { ...r, opacity: isOff ? '0.5' : '1', track: isOff ? '#C9CEC4' : '#0F7A40', knob: isOff ? '4px' : '24px',
          toggle: () => this.setState({ off: { ...off, [r.id]: !isOff } }) };
      }),
      tabs: tabs.map((t, i) => ({ ...t, active: i === 1, bg: i === 1 ? '#D7F45B' : 'transparent', color: i === 1 ? '#121712' : '#FFFFFF' }))
    };
  }
}
</script>
</body>
</html>
