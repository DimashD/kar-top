<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Статус заказа</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F7A40;text-decoration:none}a:hover{color:#0A5C30}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EA; font-family: Onest, system-ui, sans-serif; color: #121712; position: relative; overflow: hidden">
  <svg width="390" height="300" viewBox="0 0 390 300" style="position: absolute; top: 0; left: 0" aria-hidden="true">
    <rect width="390" height="300" fill="#EEF0EA"></rect>
    <rect x="230" y="20" width="140" height="90" rx="12" fill="#D4EAC6"></rect>
    <path d="M-10 150 L400 136" stroke="#FFFFFF" stroke-width="24"></path>
    <path d="M110 -10 L124 310" stroke="#FFFFFF" stroke-width="18"></path>
    <path d="M270 120 L280 310" stroke="#FFFFFF" stroke-width="14"></path>
    <rect x="16" y="30" width="80" height="90" rx="6" fill="#DCDFD6"></rect><rect x="140" y="26" width="76" height="92" rx="6" fill="#DCDFD6"></rect>
    <rect x="16" y="172" width="86" height="110" rx="6" fill="#DCDFD6"></rect><rect x="142" y="166" width="114" height="60" rx="6" fill="#DCDFD6"></rect>
    <rect x="296" y="160" width="80" height="120" rx="6" fill="#DCDFD6"></rect>
    <path d="M70 110 L116 108 L118 146 L274 140 L278 210 L318 212" stroke="#121712" stroke-width="4" fill="none" stroke-dasharray="2 8" stroke-linecap="round"></path>
  </svg>
  <span style="position: absolute; left: 50px; top: 84px; width: 40px; height: 40px; border-radius: 20px; background: #121712; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(18,23,18,.3)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D7F45B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l2-5h12l2 5M4 9v11h16V9M4 9h16M10 20v-6h4v6"></path></svg></span>
  <span style="position: absolute; left: 300px; top: 190px; width: 40px; height: 40px; border-radius: 20px; background: #D7F45B; border: 3px solid #121712; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121712" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"></path></svg></span>
  <a href="Main.dc.html" aria-label="На главную" style="position: absolute; left: 16px; top: 16px; width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(18,23,18,.12)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121712" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 270px; background: #FFFFFF; border-radius: 30px 30px 0 0; padding: 10px 16px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #E6E8E2"></span>
    <div style="display: flex; justify-content: space-between; align-items: flex-start">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 600; color: #5E665F">Заказ № 20481 · привезём 18:00–20:00</span>
        <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em">{{headline}}</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{steps}}" as="st" hint-placeholder-count="5">
        <span style="height: 6px; border-radius: 3px; background: {{st.c}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: #5E665F"><span>Принят</span><span>Сборка</span><span>Готов</span><span>В пути</span><span>У вас</span></div>

    <sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
      <section style="border-radius: 24px; background: #121712; color: #FFFFFF; padding: 14px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 800">Нет бананов Эквадор</span><span style="font-size: 12px; font-weight: 800; color: #D7F45B">ответ за 4:52</span></div>
        <div style="display: flex; gap: 12px; align-items: center">
          <span style="width: 56px; height: 56px; border-radius: 16px; background: #FFF7D6; padding: 6px; box-sizing: border-box; flex-shrink: 0"><dc-import name="Fruit" kind="banana" hint-size="44px,44px"></dc-import></span>
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #C9CFC9">Сборщик предлагает</span><span style="font-size: 15px; font-weight: 700">Бананы мини, 1 кг · 820 ₸</span></span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <button onClick="{{decline}}" style="all: unset; cursor: pointer; text-align: center; height: 48px; line-height: 48px; border-radius: 999px; background: #2A322A; font-size: 14px; font-weight: 800">Не нужно</button>
          <button onClick="{{accept}}" style="all: unset; cursor: pointer; text-align: center; height: 48px; line-height: 48px; border-radius: 999px; background: #D7F45B; color: #121712; font-size: 14px; font-weight: 800">Заменить</button>
        </div>
      </section>
    </sc-if>
    <sc-if value="{{answered}}" hint-placeholder-val="{{ false }}">
      <section style="border-radius: 20px; background: #F6F9D9; padding: 14px; font-size: 14px; font-weight: 700">{{answerText}}</section>
    </sc-if>

    <section style="border-radius: 20px; background: #F3F4EF; padding: 14px; display: flex; flex-direction: column; gap: 4px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px; font-weight: 700">К оплате курьеру</span><span style="font-size: 20px; font-weight: 800">~4 760 ₸</span></div>
      <span style="font-size: 12px; color: #5E665F">Наличными · пришлём точную сумму после взвешивания</span>
    </section>

    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="all: unset; cursor: pointer; height: 52px; border-radius: 999px; background: #F3F4EF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 800"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121712" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>Магазин</button>
      <button style="all: unset; cursor: pointer; height: 52px; border-radius: 999px; background: #F3F4EF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 800"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121712" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg>Поддержка</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { answer: null }; }
  renderVals() {
    const a = this.state.answer;
    return {
      headline: a ? 'Собираем заказ' : 'Нужен ваш ответ',
      pending: !a, answered: !!a,
      answerText: a === 'yes' ? 'Заменили на «Бананы мини». Сборка продолжается.' : 'Убрали бананы из заказа — сумма уменьшится.',
      accept: () => this.setState({ answer: 'yes' }),
      decline: () => this.setState({ answer: 'no' }),
      steps: [0, 1, 2, 3, 4].map((i) => ({ c: i < 1 ? '#0F7A40' : (i === 1 ? '#D7F45B' : '#E6E8E2') }))
    };
  }
}
</script>
</body>
</html>
