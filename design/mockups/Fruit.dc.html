</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["apple","banana","tomato","persimmon","cucumber","greens","pomegranate","potato","carrot"],"default":"apple"},"$preview":{"width":160,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'apple';
    const labels = { apple: 'Яблоко', banana: 'Бананы', tomato: 'Помидор', persimmon: 'Хурма', cucumber: 'Огурец', greens: 'Зелень', pomegranate: 'Гранат', potato: 'Картофель', carrot: 'Морковь' };
    return {
      label: labels[k] || 'Товар',
      isApple: k === 'apple', isBanana: k === 'banana', isTomato: k === 'tomato', isPersimmon: k === 'persimmon',
      isCucumber: k === 'cucumber', isGreens: k === 'greens', isPomegranate: k === 'pomegranate', isPotato: k === 'potato', isCarrot: k === 'carrot'
    };
  }
}
</script>
